<title>Hot &amp; Sun — archiwum raportów</title>
<style>
:root {
  color-scheme: light dark;
  --tlo: #fbf7f0;
  --karta: #ffffff;
  --obwodka: #e8e0d4;
  --tekst: #22282f;
  --tekst-slaby: #6d7681;
  --akcent: #d97a2b;
  --akcent-tlo: #fdf1e4;
  --morze: #1f7a8c;
  --spadek: #1a7a52;
  --wzrost: #b23a48;
  --cien: 0 1px 2px rgba(34, 40, 47, .06), 0 8px 24px rgba(34, 40, 47, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --tlo: #11161d;
    --karta: #1a212a;
    --obwodka: #2b3542;
    --tekst: #e7eaee;
    --tekst-slaby: #97a1ad;
    --akcent: #f0a15c;
    --akcent-tlo: #2a2118;
    --morze: #6ec4d4;
    --spadek: #56c98d;
    --wzrost: #f08a97;
    --cien: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 1rem 4rem;
  background: var(--tlo);
  color: var(--tekst);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.strona { max-width: 60rem; margin: 0 auto; }
a { color: var(--morze); }

header { padding: 2.5rem 0 1.5rem; }
.marka {
  font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--akcent);
}
h1 { margin: .3rem 0 .5rem; font-size: 1.85rem; line-height: 1.2; letter-spacing: -.02em; }
.kiedy { margin: 0; color: var(--tekst-slaby); }
.kryteria {
  margin: .75rem 0 0; padding: .5rem .75rem; display: inline-block;
  background: var(--akcent-tlo); border-radius: .5rem;
  font-size: .85rem; color: var(--tekst);
}

.kafle {
  display: grid; gap: .75rem; margin: 1.5rem 0 2rem;
  grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
}
.kafel {
  background: var(--karta); border: 1px solid var(--obwodka); border-radius: .75rem;
  padding: .9rem 1rem; box-shadow: var(--cien);
}
.kafel .liczba { display: block; font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
.kafel .etykieta {
  display: block; margin-top: .15rem; font-size: .75rem; text-transform: uppercase;
  letter-spacing: .06em; color: var(--tekst-slaby);
}

.hotel {
  background: var(--karta); border: 1px solid var(--obwodka); border-radius: .9rem;
  box-shadow: var(--cien); margin-bottom: 1.25rem; overflow: hidden;
}
.hotel-naglowek {
  display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: baseline;
  justify-content: space-between; padding: 1rem 1.15rem .75rem;
  border-bottom: 1px solid var(--obwodka);
}
.hotel-naglowek h2 { margin: 0; font-size: 1.1rem; letter-spacing: -.01em; }
.hotel-meta { margin: .2rem 0 0; font-size: .8rem; color: var(--tekst-slaby); }
.hotel-cena { font-size: 1.35rem; font-weight: 700; color: var(--akcent); white-space: nowrap; }
.hotel-cena small { font-size: .7rem; font-weight: 500; color: var(--tekst-slaby); }

table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th {
  text-align: left; padding: .5rem 1.15rem; font-size: .7rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: .07em; color: var(--tekst-slaby);
  border-bottom: 1px solid var(--obwodka); white-space: nowrap;
}
td { padding: .6rem 1.15rem; border-bottom: 1px solid var(--obwodka); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr.najtaniej { background: var(--akcent-tlo); }
tr.nieaktualna td { color: var(--tekst-slaby); }
.portal { font-weight: 600; }
.cena { font-weight: 700; white-space: nowrap; }
.cena small { display: block; font-weight: 400; font-size: .75rem; color: var(--tekst-slaby); }
.termin { white-space: nowrap; }
.spadek { color: var(--spadek); font-weight: 600; }
.wzrost { color: var(--wzrost); font-weight: 600; }
.bez-zmian { color: var(--tekst-slaby); }
.odznaka {
  display: inline-block; padding: .05rem .4rem; border-radius: .35rem;
  background: var(--akcent); color: #fff; font-size: .65rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; vertical-align: .1em;
}
@media (prefers-color-scheme: dark) { .odznaka { color: #12171f; } }
.odznaka-minimum {
  background: none; color: var(--akcent); border: 1px solid var(--akcent); padding: 0 .35rem;
}
@media (prefers-color-scheme: dark) { .odznaka-minimum { color: var(--akcent); } }
tr.alternatywa td {
  padding-top: 0; padding-bottom: .55rem; padding-left: 2.15rem;
  font-size: .8rem; color: var(--tekst-slaby); border-bottom: none;
}
tr.alternatywa + tr:not(.alternatywa) td { border-top: 1px solid var(--obwodka); }
.pusto { padding: 1rem 1.15rem; color: var(--tekst-slaby); }

.archiwum { list-style: none; margin: 0; padding: 0; }
.archiwum li { border-bottom: 1px solid var(--obwodka); }
.archiwum a {
  display: flex; justify-content: space-between; gap: 1rem;
  padding: .7rem .25rem; text-decoration: none; color: var(--tekst);
}
.archiwum a:hover { color: var(--akcent); }
.archiwum .godzina { color: var(--tekst-slaby); font-variant-numeric: tabular-nums; }

footer {
  margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--obwodka);
  font-size: .8rem; color: var(--tekst-slaby);
}
footer a { color: var(--tekst-slaby); }

@media (max-width: 40rem) {
  h1 { font-size: 1.45rem; }
  thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  tr { display: block; }
  tr:not(.alternatywa) { padding: .35rem 0; border-bottom: 1px solid var(--obwodka); }
  tr:not(.alternatywa):last-child { border-bottom: none; }
  td { display: flex; gap: 1rem; justify-content: space-between; align-items: baseline;
       padding: .2rem 1.15rem; border-bottom: none; text-align: right; }
  td::before {
    content: attr(data-etykieta); text-align: left; flex: 0 0 auto;
    font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--tekst-slaby);
  }
  td.pelna-szerokosc { display: block; text-align: left; }
  td.pelna-szerokosc::before { content: none; }
  td.portal {
    display: block; text-align: left; padding-bottom: .35rem; font-size: 1rem;
  }
  td.portal::before { content: none; }
  .cena small { display: inline; margin-left: .35rem; }
}
</style>
